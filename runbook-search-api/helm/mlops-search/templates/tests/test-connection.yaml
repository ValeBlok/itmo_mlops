apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "mlops-search.name" . }}-test"
  labels:
    # Намеренно НЕ selector labels: test pod не должен попадать в endpoints Service.
    app.kubernetes.io/name: mlops-search-test
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    runAsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: curl
      image: curlimages/curl:8.15.0
      args: ["--fail", "--silent", "--show-error", "--retry", "5", "--retry-connrefused", "--retry-delay", "2",
             "http://{{ include "mlops-search.name" . }}:{{ .Values.service.port }}/readyz"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
